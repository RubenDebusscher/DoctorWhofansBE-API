nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            [
                '^https?://(([a-z0-9-]+\.)?doctorwhofans\.test|localhost)(:[0-9]+)?$',
            ]
        allow_credentials: true
        allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
        allow_headers:
            ["Content-Type", "Authorization", "Accept", "X-Requested-With"]
        expose_headers: ["Link"]
        max_age: 3600
    paths:
        "^/api/":
            allow_origin:
                [
                    '^https?://(([a-z0-9-]+\.)?doctorwhofans\.test|localhost)(:[0-9]+)?$',
                ]
            allow_credentials: true
            allow_headers:
                ["Content-Type", "Authorization", "Accept", "X-Requested-With"]
            allow_methods: ["POST", "PUT", "GET", "DELETE", "OPTIONS", "PATCH"]
            max_age: 3600
